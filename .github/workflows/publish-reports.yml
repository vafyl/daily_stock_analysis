name: 发布在线研报

on:
  workflow_run:
    workflows: [每日股票分析]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-reports.yml
      - scripts/collect_pages_reports.py
      - apps/dsa-web/pages/**
      - apps/dsa-web/src/report-site/**
      - apps/dsa-web/src/components/report/ReportMarkdownBody.tsx
      - apps/dsa-web/vite.pages.config.ts
      - apps/dsa-web/package*.json

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/dsa-web/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 构建在线报告页
        working-directory: apps/dsa-web
        run: npm ci && npm run build:pages
      - name: 汇总已完成的分析报告
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_REPOSITORY: ${{ github.repository }}
          REPORT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/collect_pages_reports.py --repository "$REPORT_REPOSITORY" --branch "$REPORT_BRANCH" --output .tmp/pages/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .tmp/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
